<main class="container py-3">
  <div
    class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3"
  >
    <div class="d-flex w-100 gap-3">
      <div class="w-100" style="max-width: 480px">
        <input
          type="text"
          class="app-search-input"
          placeholder="Search projects, tasks, or people..."
        />
      </div>

      <button class="app-btn-primary d-flex align-items-center gap-2">
        <i class="bi bi-search"></i>
        Search
      </button>
    </div>

    <div class="d-none d-md-flex app-view-toggle">
      <button class="app-toggle-btn active">
        <span class="material-icons-round">grid_view</span>
      </button>
      <button class="app-toggle-btn">
        <span class="material-icons-round">view_list</span>
      </button>
    </div>
  </div>
  <div
    class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4"
  >
    <div></div>
  </div>

  <div class="d-flex flex-wrap gap-2 mb-5 overflow-auto pb-2">
    <button class="app-filter-btn active">All Projects</button>

    <button class="app-filter-btn">
      <span class="app-tag-dot engineering"></span>
      Turing
    </button>

    <button class="app-filter-btn">
      <span class="app-tag-dot marketing"></span>
      Tesla
    </button>

    <button class="app-filter-btn">
      <span class="app-tag-dot design"></span>
      Hamilton
    </button>

    <button class="app-filter-btn">
      <span class="app-tag-dot hr"></span>
      Thompson
    </button>

    <button class="app-filter-btn">
      <span class="app-tag-dot hr"></span>
      Richie
    </button>
  </div>

  <div id="teamsContainer" class="row g-4">
      <!-- Here we inject the teams-->
  </div>
</main>
