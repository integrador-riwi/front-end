<div class="container-fluid py-1">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
    <div class="d-flex w-100 gap-3 align-items-center">
      <div class="w-100" style="max-width: 480px">
        <input type="text" id="teamsSearchInput" class="app-search-input"
          placeholder="Search projects, tasks, or people..." />
        <div id="semanticHint" class="sem-hint d-none">
          <span class="material-icons-round" style="font-size:0.85rem;vertical-align:middle;">info</span>
          Press <kbd>Enter</kbd> or click <strong>Search</strong> to run semantic search.
        </div>
      </div>

      <button id="teamsSearchBtn" class="app-btn-primary d-flex align-items-center gap-2">
        <i class="bi bi-search"></i>
        Search
      </button>

      <!-- Semantic search toggle — rendered only for admins via JS -->
      <div id="semanticToggleWrap" class="sem-toggle-wrap d-none">
        <label class="sem-toggle-label" for="semanticToggle">
          <input type="checkbox" id="semanticToggle" class="sem-toggle-input" />
          <span class="sem-toggle-track">
            <span class="sem-toggle-thumb"></span>
          </span>
          <span class="sem-toggle-text">
            <span class="material-icons-round sem-toggle-icon">auto_awesome</span>
            Semantic
          </span>
        </label>
      </div>
    </div>

    <div class="d-none d-md-flex app-view-toggle">
      <button class="app-toggle-btn active" id="grid-view-btn">
        <span class="material-icons-round">grid_view</span>
      </button>
      <button class="app-toggle-btn" id="list-view-btn">
        <span class="material-icons-round">view_list</span>
      </button>
    </div>
  </div>
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
    <div></div>
  </div>

  <div class="d-flex flex-wrap gap-2 mb-3 overflow-auto pb-2" id="clanFiltersContainer">
    <!-- Los filtros de clan se generan dinámicamente desde JS -->
  </div>

  <div id="teamsContainer" class="row g-4">
    <!-- Here we inject the teams-->
  </div>
</div>
